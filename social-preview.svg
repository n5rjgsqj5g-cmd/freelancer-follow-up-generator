<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Freelancer Follow-up Generator</title>
  <desc id="desc">Four factual follow-up drafts, generated locally in the browser.</desc>
